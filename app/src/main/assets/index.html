<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diary Apps</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#16252b;--mut:#62767c;--pri:#0b5d57;--pri2:#e3f1ef;--amb:#f2a900;--red:#d62839;--redbg:#fde8ea;--line:#d9e2e1;--ok:#1b8a4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Noto Sans Bengali","Noto Sans",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--amb);color:#3a2900}
.badge.free{background:#ffffff33;color:#fff}
.lang{border:1px solid #ffffff88;background:transparent;color:#fff;border-radius:8px;padding:4px 9px;font-size:13px}
main{flex:1;overflow:auto;padding:14px 14px 24px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{min-width:0;flex:1;border:0;background:none;padding:8px 2px 7px;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:19px}
nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.low{border-color:var(--red);background:var(--redbg);border-left:6px solid var(--red)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}.b{font-weight:700}.red{color:var(--red)}.ok{color:var(--ok)}
.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.btn.ghost{background:var(--pri2);color:var(--pri)}.btn.warn{background:var(--redbg);color:var(--red)}.btn.sm{padding:6px 10px;font-size:13px}
.btn.amb{background:var(--amb);color:#3a2900}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 0}label input,label select,label textarea{margin-top:3px;color:var(--ink)}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:10px;padding-bottom:2px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat small{color:var(--mut);display:block}.stat b{font-size:19px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--pri2);color:var(--pri)}
.tag.r{background:var(--red);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
h2{font-size:17px;margin:4px 0 10px}h3{margin:0 0 6px}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16252b;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;display:none;z-index:10;max-width:90%}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.inv{font-size:14px}.inv .line{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.plan{border:2px solid var(--line)}.plan.cur{border-color:var(--pri);background:var(--pri2)}
.bar{display:flex;flex-wrap:wrap;gap:6px;position:sticky;bottom:-16px;background:var(--card);padding:10px 0 2px;margin-top:8px;border-top:1px solid var(--line)}
.btn[disabled]{opacity:.5}
.pimg{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:0 0 auto}
header h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--pri);border:2px solid #ffffff99;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;flex:0 0 auto;font-size:16px}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar.big{width:72px;height:72px;font-size:30px;border-color:var(--line);background:var(--pri2)}
.card .avatar{border-color:var(--line);background:var(--pri2)}
#auth{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;z-index:8;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}#auth.open{display:block}.authbox{max-width:420px;margin:0 auto}.alogo{font-size:38px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-size:14px;color:var(--mut)}.seg button.on{background:var(--pri);color:#fff;font-weight:700}

:root{--warnbg:#fff6dd}
:root[data-theme=dark]{--bg:#0e1a1d;--card:#15262a;--ink:#e8f1f1;--mut:#92a8ac;--pri:#1f9a8f;--pri2:#16383a;--line:#26393d;--redbg:#3a1c21;--warnbg:#3a3114;--red:#ff6b78;--ok:#41c97a}
:root[data-theme=dark] nav button.on{color:#52d6c9;box-shadow:inset 0 3px 0 #52d6c9}
.banner{height:112px;border-radius:16px;background:var(--pri) center/cover no-repeat;display:flex;align-items:flex-end;color:#fff;margin-bottom:12px;overflow:hidden}
.bn{padding:10px 14px;background:linear-gradient(transparent,#0009);width:100%}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.tile.low{border-color:var(--red);background:var(--redbg)}.tile .ti{font-size:20px}.tile b{display:block;font-size:20px}.tile small{color:var(--mut);font-size:11px}
</style>
</head>
<body>
<div id="app">
  <header><button id="avatar" class="avatar" onclick="openProfile()"></button><h1 id="title">Diary Apps</h1><span id="badge" class="badge"></span><button class="lang" id="langBtn"></button></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="auth"></div><div id="modal"></div><div id="toast"></div>

/* ---------- backend (Supabase) + account ---------- */
async function rpc(fn,args){
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY)throw new Error('not_configured');
  const h={'Content-Type':'application/json',apikey:CFG.SUPABASE_ANON_KEY};
  if(/^eyJ/.test(CFG.SUPABASE_ANON_KEY))h.Authorization='Bearer '+CFG.SUPABASE_ANON_KEY;
  let r;try{r=await fetch(CFG.SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)})}catch(e){throw new Error('network')}
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&(j.message||j.error))||('http_'+r.status));
  return j;
}
const ERR={bad_phone:'invalidNumber',bad_pin_format:'pinRule',bad_pin:'errBadPin',not_found:'errNotFound',phone_exists:'errExists',pin_not_set:'errPinNotSet',too_many:'errTooMany',device_locked:'errDeviceLocked',session_invalid:'errSession',logo_too_big:'errLogoBig',bad_install:'netErr'};
const errMsg=e=>{const m=e.message||'';if(m==='not_configured')return t('notSetup');if(m==='network')return t('netErr');
  for(const k in ERR)if(m.indexOf(k)>=0)return t(ERR[k]);
  return/trx_used/.test(m)?t('trxUsed'):/pending_exists/.test(m)?t('pendingExists'):/invalid_sender/.test(m)?t('invalidNumber'):/invalid_trx/.test(m)?t('invalidTrx'):m};
// Manual edits in Supabase may be typed loosely ("Monthly Pro", "Active"): normalise before use.
const normPlan=p=>{p=String(p||'').trim().toLowerCase();return(!p||p==='free')?'free':/year|annual/.test(p)?'yearly':'monthly'};
const normPhone=s=>String(s||'').replace(/[\s-]/g,'').replace(/^\+?88/,'');
const logged=()=>!!(S.acct&&S.acct.token);

async function pushReq(r){
  try{await rpc('app_submit_payment',{p_phone:S.acct.phone,p_token:S.acct.token,p_plan:r.plan,p_amount:r.amount,p_method:String(r.method).toLowerCase(),p_sender:r.sender,p_trx:r.trx,p_reference:r.reference||''});r.synced=true}
  catch(e){if(/pending_exists/.test(e.message))r.synced=true;else throw e}
}
async function pushProfile(){
  const b=S.biz,r=await rpc('app_save_profile',{p_phone:S.acct.phone,p_token:S.acct.token,p_name:b.name||'',p_bphone:b.phone||'',p_addr:b.addr||'',p_logo:b.logo||''});
  if(r&&r.ok===false)throw new Error(r.error||'profile');
  S.profileDirty=false;
}
// Reads plan / approval result from the backend. Only here can a paid plan become Active.
function applyStatus(r){
  const plan=normPlan(r.plan),st=String(r.status||'').trim().toLowerCase();
  S.sub=(plan!=='free'&&r.expires_at)?{v2:1,plan,expiry:Date.parse(r.expires_at)||0}:{v2:1,plan:'free',expiry:0};
  if(st==='pending'||st==='rejected'){
    const rp=normPlan(r.requested_plan);
    S.req={...(S.req||{}),plan:rp==='free'?((S.req&&S.req.plan)||'monthly'):rp,status:st,note:r.admin_note||'',trx:r.trx_id||(S.req&&S.req.trx),synced:true,ts:Date.parse(r.updated_at)||Date.now()};
  }else if(S.req&&S.req.synced)S.req=null; // approved: the plan itself now shows it
  S.multi=!!r.allow_multi;
}
let syncing=false;
async function syncSub(silent){
  if(!logged()||syncing)return;syncing=true;
  try{
    if(S.req&&S.req.status==='pending'&&!S.req.synced)await pushReq(S.req);
    if(S.profileDirty)await pushProfile().catch(e=>{if(/session_invalid/.test(e.message))throw e});
    const r=await rpc('app_status',{p_phone:S.acct.phone,p_token:S.acct.token});
    if(!r||r.ok===false){if(r&&r.error==='session_invalid')return forceLogout('errSession');throw new Error((r&&r.error)||'bad_response')}
    applyStatus(r);
    S.syncInfo={ts:Date.now(),ok:true,msg:`plan=${r.plan}, status=${r.status}, expires=${r.expires_at?String(r.expires_at).slice(0,10):'—'}`};
    save();render();if(!silent)toast(t('statusUpdated'));
  }catch(e){
    if(/session_invalid/.test(e.message))return forceLogout('errSession');
    S.syncInfo={ts:Date.now(),ok:false,msg:e.message};save();if(!silent)toast(errMsg(e));if(tab==='more'&&view==='sub')render();
  }finally{syncing=false}
}

const deviceModel=()=>{const m=(navigator.userAgent||'').match(/;\s*([^;)]+?)\s+Build/);return(m?m[1]:'Android').slice(0,60)};
async function doAuth(){
  const ph=normPhone($('#a_ph').value),pin=$('#a_pin').value.trim(),err=m=>{$('#a_err').textContent=m};
  if(!/^01[3-9]\d{8}$/.test(ph))return err(t('invalidNumber'));
  if(!/^\d{4,6}$/.test(pin))return err(t('pinRule'));
  if(authMode==='create'&&pin!==$('#a_pin2').value.trim())return err(t('pinMismatch'));
  const b=$('#a_btn');b.disabled=true;err('');
  try{
    const r=await rpc('app_login',{p_phone:ph,p_pin:pin,p_install:S.dev,p_model:deviceModel(),p_create:authMode==='create'});
    if(!r||!r.ok){b.disabled=false;return err(t(ERR[r&&r.error]||'netErr'))}
    afterLogin(ph,r);
  }catch(e){b.disabled=false;err(errMsg(e))}
}
function afterLogin(ph,r){
  const prev=S.lastPhone,other=prev&&prev!==ph;
  const finish=()=>{
    S.acct={phone:ph,token:r.token};S.lastPhone=ph;
    if(other){S.biz={name:'',phone:'',addr:'',logo:'',banner:''};S.req=null}
    const p=r.profile||{};
    S.biz.name=S.biz.name||p.name||'';S.biz.phone=S.biz.phone||p.phone||ph;S.biz.addr=S.biz.addr||p.address||'';S.biz.logo=S.biz.logo||p.logo||'';
    applyStatus(r.status||{});save();primeLogo();render();
    profileForm(true); // business name / logo / phone are asked at the start of every login
  };
  const hasData=S.products.length||S.invoices.length||S.txns.length;
  if(other&&hasData)ask(t('wipeAsk'),()=>{S.products=[];S.customers=[];S.txns=[];S.invoices=[];finish()},finish,t('wipeYes'),t('wipeNo'));
  else finish();
}
function forceLogout(key){S.acct=null;S.req=null;S.sub={v2:1,plan:'free',expiry:0};save();render();showAuth(key?t(key):'')}

function pickLogo(inp){
  const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{const M=256,sc=Math.min(1,M/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc)),c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      let q=.85,d=c.toDataURL('image/jpeg',q);while(d.length>70000&&q>.3){q-=.15;d=c.toDataURL('image/jpeg',q)}setLogo(d)};
    im.onerror=()=>toast(t('failed'));im.src=rd.result};
  rd.readAsDataURL(f);
}

    im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc)),c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',.75))};

S.f=S.f||1;S.grp=S.grp||'d';S.lg=S.lg||'sum';S.rg=S.rg||'month';S.ck=S.ck||'business';
const from=d=>{if(d==='all')return 0;if(d===1){const x=new Date();x.setHours(0,0,0,0);return+x}return Date.now()-d*DAY};

function rgBounds(k){

const inR=(ts,b)=>ts>=b[0]&&ts<=b[1];
/* figures from confirmed invoices in a time range */
function invStats(b){
  const r={n:0,pend:0,canc:0,rev:0,cogs:0,del:0,adv:0,gross:0,prod:{}};
  S.invoices.forEach(v=>{
    if(v.status==='confirmed'){
      if(!inR(v.cts||v.ts,b))return;const T=tot(v);r.n++;r.rev+=T.sub-T.disc;r.del+=T.del;r.adv+=T.adv;
      v.items.forEach(i=>{const c=(i.cost||0)*i.qty;r.cogs+=c;const nm=itemName(i),p=r.prod[nm]=r.prod[nm]||{q:0,rev:0};p.q+=i.qty;p.rev+=i.price*i.qty});
    }else if(inR(v.ts,b)){if(v.status==='cancelled')r.canc++;else r.pend++}
  });
  r.gross=r.rev-r.cogs;return r;
}
function vLedger(){
  const seg=`<div class="seg">${[['sum','summary'],['cost','costs'],['rep','reports']].map(([k,l])=>`<button class="${S.lg===k?'on':''}" onclick="S.lg='${k}';save();render()">${t(l)}</button>`).join('')}</div>`;
  ({sum:lgSum,cost:lgCost,rep:lgRep})[S.lg||'sum'](seg);

function lgSum(seg){
  const f=S.f,tx=S.txns.filter(x=>x.ts>=from(f)).sort((a,b)=>b.ts-a.ts),cs=S.costs.filter(c=>c.ts>=from(f));
  const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
  const bizC=sum(cs.filter(c=>c.kind==='business'),c=>c.amt),perC=sum(cs.filter(c=>c.kind!=='business'),c=>c.amt);
  const sales=sum(tx.filter(x=>x.type==='income'),x=>x.amt),exp=sum(tx.filter(x=>x.type==='expense'),x=>x.amt);
  const cogs=sum(tx,x=>x.cogs||0),opex=sum(tx.filter(x=>x.type==='expense'&&x.kind!=='stockin'),x=>x.amt);
  const profit=sales-cogs-opex-bizC,bal=sales-exp-bizC-perC,cap=sum(S.products,p=>p.buy*p.qty),tgt=sales*S.margin/100;
  const chips=[[1,'today'],[7,'d7'],[30,'d30'],[90,'d90'],['all','all']].map(([d,k])=>`<button class="chip ${f===d?'on':''}" onclick="setF(${typeof d==='string'?`'${d}'`:d})">${t(k)}</button>`).join('');
  const key=x=>{const d=new Date(x.ts),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return S.grp==='y'?`${y}`:S.grp==='m'?`${y}-${m}`:`${y}-${m}-${dd}`};
  const G={};const gg=k=>G[k]=G[k]||{s:0,e:0,c:0,o:0};
  tx.forEach(x=>{const g=gg(key(x));if(x.type==='income')g.s+=x.amt;else{g.e+=x.amt;if(x.kind!=='stockin')g.o+=x.amt}g.c+=x.cogs||0});
  cs.forEach(c=>{const g=gg(key(c));g.e+=c.amt;if(c.kind==='business')g.o+=c.amt});
  const rows=Object.keys(G).sort().reverse().map(k=>{const g=G[k],p=g.s-g.c-g.o;return`<tr><td>${k}</td><td>${money(g.s)}</td><td>${money(g.e)}</td><td class="${p>=0?'ok':'red'}">${money(p)}</td></tr>`}).join('');
  $('#main').innerHTML=seg+`<div class="chips">${chips}</div>
  <div class="grid"><div class="stat"><small>${t('sales')}</small><b class="ok">${money(sales)}</b></div><div class="stat"><small>${t('expenses')}</small><b class="red">${money(exp)}</b></div>
  <div class="stat"><small>${t('netProfit')}</small><b class="${profit>=0?'ok':'red'}">${money(profit)}</b></div><div class="stat"><small>${t('balance')}</small><b>${money(bal)}</b></div>
  <div class="stat"><small>${t('bizCost')}</small><b>${money(bizC)}</b></div><div class="stat"><small>${t('personalCost')}</small><b>${money(perC)}</b></div>
  <div class="stat"><small>${t('capital')}</small><b>${money(cap)}</b></div><div class="stat"><small>${t('target')} (${S.margin}%)</small><b>${money(tgt)}</b></div></div>
  <div class="btns" style="margin:0 0 10px"><button class="btn sm" onclick="txForm('income')">＋ ${t('addIncome')}</button><button class="btn sm warn" onclick="costForm()">－ ${t('addCost')}</button></div>
  <div class="card"><div class="chips" style="margin-bottom:6px">${[['d','daily'],['m','monthly'],['y','yearly']].map(([k,l])=>`<button class="chip ${S.grp===k?'on':''}" onclick="S.grp='${k}';save();render()">${t(l)}</button>`).join('')}</div>
  ${rows?`<table><tr><th>${t('period')}</th><th>${t('sales')}</th><th>${t('expenses')}</th><th>${t('profit')}</th></tr>${rows}</table>`:`<div class="empty">${t('noTx')}</div>`}</div>
  <h2>${t('entries')}</h2>${tx.slice(0,40).map(x=>`<div class="card between"><div><div class="b">${esc(x.note||x.kind||'')}</div><div class="mut">${fdate(x.ts)}</div></div><b class="${x.type==='income'?'ok':'red'}">${x.type==='income'?'+':'−'}${money(x.amt)}</b></div>`).join('')}`;

function addItem(id,vi){
  if(!id&&id!==0)return;id=+id;if(!id)return;const p=S.products.find(x=>x.id===id);if(!p)return;
  if(hasV(p)&&vi===undefined)return varPick(id);
  const vn=hasV(p)?p.vars[vi].n:'',i=D.items.find(x=>x.pid===id&&(x.var||'')===vn);
  if(i)i.qty++;else D.items.push({pid:id,qty:1,price:p.sell,var:vn});render();
}
function chQty(ix,d){D.items[ix].qty+=d;if(D.items[ix].qty<=0)D.items.splice(ix,1);render()}
function setPrice(ix,v){D.items[ix].price=+v||0;render()}
function snapshot(){
  const items=[];
  D.items.forEach(i=>{
    if(i.one){items.push({pid:0,one:true,name:i.name,price:+i.price||0,cost:+i.cost||0,qty:i.qty,weight:0,size:'',var:''});return}
    const p=S.products.find(x=>x.id===i.pid);if(p)items.push({pid:p.id,name:p.name,var:i.var||'',price:+i.price||0,cost:p.buy,qty:i.qty,weight:p.weight,size:p.size});
  });
  const w0=items.reduce((s,i)=>s+(+i.weight||0)*i.qty,0),pk=packW(w0);
  return{cust:D.cust.trim(),phone:D.phone.trim(),alt:D.alt.trim(),addr:D.addr.trim(),note:D.note.trim(),delivery:+D.delivery||0,discount:+D.discount||0,advance:+D.advance||0,
    weight:w0+pk,pack:pk,sizes:[...new Set(items.map(i=>i.size).filter(Boolean))].join(', '),
    biz:{name:S.biz.name,phone:S.biz.phone,addr:S.biz.addr,tagline:S.biz.tagline||'',merchant:S.biz.merchant||''},items};
}
const nextNo=()=>Math.max((+S.invStart||1001)-1,...S.invoices.map(v=>+v.no||0))+1;
const stockShort=items=>{for(const i of items){if(i.one)continue;const p=S.products.find(x=>x.id===i.pid);if(!p||availQ(p,i.var)<i.qty)return p?itemName({name:p.name,var:i.var}):'?'}return null};
function commitInv(status){
  if(!D.items.length)return toast(t('noItems'));
  const ed=D.editId?S.invoices.find(x=>x.id===D.editId):null;
  if(!ed&&tier()==='free'&&S.invoices.length>=LIM.invoices)return upsell();
  const snap=snapshot();
  if(status==='confirmed'){const bad=stockShort(snap.items);if(bad)return toast(`${t('noStock')}: ${bad}`)}
  let v;if(ed){Object.assign(ed,snap);v=ed}else{v={id:uid(),no:nextNo(),ts:Date.now(),...snap};S.invoices.push(v)}
  v.status='pending';v.custId=upsertCust(v);
  if(status==='confirmed')confirmInv(v.id,true);
  D=newDraft();save();render();showInv(v.id);
}
function confirmInv(id,silent){
  const v=S.invoices.find(x=>x.id===id);if(!v||v.status==='confirmed')return false;
  const bad=stockShort(v.items);if(bad){toast(`${t('noStock')}: ${bad}`);return false}
  let cogs=0;v.items.forEach(i=>{if(i.one){cogs+=(+i.cost||0)*i.qty;return}const p=S.products.find(x=>x.id===i.pid);adjQ(p,i.var,-i.qty);i.cost=p.buy;cogs+=p.buy*i.qty;logMove(p,-i.qty,'invoice',{ref:'#'+v.no,v:i.var})});
  const T=tot(v);S.txns.push({id:uid(),ts:Date.now(),type:'income',kind:'invoice',inv:v.id,amt:T.sub-T.disc,cogs,note:`${t('invoiceNo')} #${v.no}`});
  v.status='confirmed';v.cts=Date.now();save();
  if(!silent){render();showInv(id)}
  return true;
}
function cancelInv(id){
  const v=S.invoices.find(x=>x.id===id);
  ask(t('cancelInvAsk'),()=>{if(v.status==='confirmed')revertInv(v);v.status='cancelled';save();render();showInv(id)},null,t('yesCancel'),t('no'));

function delInv(id){ask(t('confirmDel'),()=>{S.invoices=S.invoices.filter(x=>x.id!==id);save();render()})}
function editInv(id){
  const v=S.invoices.find(x=>x.id===id);
  const go2=()=>{D=newDraft({cust:v.cust,phone:v.phone,alt:v.alt||'',addr:v.addr,note:v.note||'',delivery:v.delivery,discount:v.discount||0,advance:v.advance||0,editId:id,
    items:v.items.filter(i=>i.one||S.products.some(p=>p.id===i.pid)).map(i=>({pid:i.pid,qty:i.qty,price:i.price,var:i.var||'',one:!!i.one,name:i.name,cost:i.cost}))});S.iv='new';closeM();go('invoice')};
  if(v.status==='confirmed')ask(t('movePendingAsk'),()=>{revertInv(v);v.status='pending';save();go2()},null,t('yesMove'),t('no'));else go2();
}
function upsertCust(v){ // customers are created automatically from invoices
  const nm=v.cust,ph=v.phone;if(!nm&&!ph)return 0;
  let c=S.customers.find(x=>(ph&&x.phone===ph)||(!ph&&x.name.toLowerCase()===nm.toLowerCase()));
  if(!c){c={id:uid(),name:nm||ph,phone:ph,alt:v.alt||'',address:v.addr,note:''};S.customers.push(c)}
  else{if(!c.phone&&ph)c.phone=ph;if(!c.address&&v.addr)c.address=v.addr;if(!c.alt&&v.alt)c.alt=v.alt}
  return c.id;
}

  const wrap=(s,mw,max)=>{const out=[];let line='';String(s||'').split(/\s+/).filter(Boolean).forEach(w=>{const tst=line?line+' '+w:w;if(x.measureText(tst).width>mw&&line){out.push(line);line=w}else line=tst});if(line)out.push(line);return out.slice(0,max)};

  x.font=F(15);x.fillStyle='#444';wrap(b.addr,430-(nx-P),2).forEach(l=>{x.fillText(l,nx,y);y+=20});if(b.phone)x.fillText(b.phone,nx,y);
  x.textAlign='right';x.fillStyle='#111';x.font=F(32,'bold');x.fillText(t('invoiceTitle'),W-P,P+30);
  x.font=F(15);x.fillStyle='#444';let ry=P+56;const meta=[`${t('invNoLbl')}: ${v.no?'#'+v.no:'DRAFT'}`,fdate(v.ts||Date.now())];
  if(b.merchant)meta.push(`${t('merchantId')}: ${b.merchant}`);if(v.courier&&v.courier.tracking)meta.push(`${t('parcelId')}: ${v.courier.tracking}`);
  meta.forEach(m=>{x.fillText(fit(m,300),W-P,ry);ry+=22});

  x.textAlign='left';x.font=F(14,'normal','italic');x.fillStyle='#666';x.fillText(t('billTo'),P,208);
  x.fillStyle='#111';x.font=F(20,'bold');x.fillText(fit(v.cust||t('walkin'),380),P,234);
  x.font=F(15);x.fillStyle='#444';let yy=256;const ph=[v.phone,v.alt].filter(Boolean).join(' / ');if(ph){x.fillText(ph,P,yy);yy+=20}wrap(v.addr,380,2).forEach(l=>{x.fillText(l,P,yy);yy+=20});
  x.textAlign='right';x.fillText(`${t('totalWeight')}: ${(+v.weight||0).toFixed(2)} kg`,W-P,234);if(v.sizes)x.fillText(fit(`${t('sizes')}: ${v.sizes}`,300),W-P,256);
  x.fillStyle='#eceff0';x.fillRect(P,top,W-2*P,36);x.fillStyle='#111';x.fillRect(P,top,W-2*P,1);x.fillRect(P,top+35,W-2*P,1);
  x.font=F(15,'bold');x.textAlign='left';x.fillText(t('sl'),P+8,top+24);x.fillText(t('desc'),P+52,top+24);x.textAlign='right';x.fillText(t('qty'),520,top+24);x.fillText(t('unitPrice'),640,top+24);x.fillText(t('total'),W-P-8,top+24);
  let ty=top+36;
  items.forEach((i,n)=>{x.font=F(16);x.fillStyle='#111';x.textAlign='left';x.fillText(String(n+1),P+8,ty+24);x.fillText(fit(itemName(i),320),P+52,ty+24);x.textAlign='right';x.fillText(String(i.qty),520,ty+24);x.fillText(money(i.price),640,ty+24);x.fillText(money(i.price*i.qty),W-P-8,ty+24);x.fillStyle='#d6dcdc';x.fillRect(P,ty+RH-1,W-2*P,1);ty+=RH});
  ty+=22;const lx=430,rx=W-P;
  lines.forEach(([l,val,k])=>{x.fillStyle='#111';x.font=k==='cod'?F(20,'bold'):k==='g'?F(17,'bold'):F(16);
    if(k==='g')x.fillRect(lx,ty,rx-lx,1);if(k==='cod'){x.fillRect(lx,ty+2,rx-lx,2);x.fillRect(lx,ty+36,rx-lx,2)}

  ask(`${t('confirmDel')} “${k}”`,()=>{S.cats=S.cats.filter(c=>c!==k);if(!S.cats.includes('Other'))S.cats.push('Other');S.products.forEach(p=>{if(p.cat===k)p.cat='Other'});if(S.cf===k)S.cf='all';save();render()});
}

function cloudData(){const o=JSON.parse(backupData());o.data.products=o.data.products.map(p=>({...p,img:''}));return o}
async function cloudSave(silent){
  if(!logged())return;
  try{const r=await rpc('app_cloud_save',{p_phone:S.acct.phone,p_token:S.acct.token,p_data:cloudData()});
    if(r&&r.ok===false){if(r.error==='session_invalid')return forceLogout('errSession');throw new Error(r.error)}
    S.cloudAt=Date.now();save();if(!silent){toast(t('cloudSaved'));render()}}
  catch(e){if(!silent)toast(errMsg(e))}
}
async function cloudRestore(){
  if(!logged())return;
  try{const r=await rpc('app_cloud_load',{p_phone:S.acct.phone,p_token:S.acct.token});
    if(!r||r.ok===false){if(r&&r.error==='session_invalid')return forceLogout('errSession');return toast(t('noCloud'))}
    ask(t('restoreAsk'),()=>{applyBackup(r.data,true);toast(t('restored'))},null,t('restore'))}
  catch(e){toast(errMsg(e))}
}

function isConf(id){
  const c=S.couriers[id]||{},f=k=>String(c[k]||'').trim(),d=COURIERS.find(x=>x.id===id);

function payMethod(){$('#p_num').textContent=(CFG.PAYMENT_NUMBERS||{})[$('#p_m').value]||''}
function copyNum(){const n=$('#p_num').textContent;const ta=document.createElement('textarea');ta.value=n;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();toast(t('copied'))}
async function submitPay(plan){
  const g=i=>$('#p_'+i).value.trim();
  const sender=g('s').replace(/[\s-]/g,'').replace(/^\+?88/,'');if(!/^01[3-9]\d{8}$/.test(sender))return toast(t('invalidNumber'));
  const trx=g('t').toUpperCase();if(!/^[A-Z0-9]{6,30}$/.test(trx))return toast(t('invalidTrx'));
  const amount=parseFloat(g('a'));if(!(amount>0))return toast(t('invalidAmt'));
  const r={plan,amount,method:g('m'),sender,trx,reference:g('r'),status:'pending',synced:false,ts:Date.now()};
  const b=$('#p_btn');b.disabled=true;
  try{await pushReq(r);S.req=r;save();closeM();render();toast(t('pendingMsg'));syncSub(true)}
  catch(e){
    b.disabled=false;
    if(/session_invalid/.test(e.message))return forceLogout('errSession');
    if(e.message==='network'){S.req=r;save();closeM();render();toast(t('netSaved'))} // kept as Pending, sent when online
    else toast(errMsg(e));
  }
}

applyTheme();primeLogo();render();
if(!logged())showAuth('');else{if(!S.biz.name)profileForm(true);syncSub(true);if(S.cloudAuto&&Date.now()-(S.cloudAt||0)>864e5)setTimeout(()=>cloudSave(true),4000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSub(true)});
setInterval(()=>{if(!document.hidden)syncSub(true)},45000);
</script>
