<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diary Apps</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#16252b;--mut:#62767c;--pri:#0b5d57;--pri2:#e3f1ef;--amb:#f2a900;--red:#d62839;--redbg:#fde8ea;--line:#d9e2e1;--ok:#1b8a4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Noto Sans Bengali","Noto Sans",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--amb);color:#3a2900}
.badge.free{background:#ffffff33;color:#fff}
.lang{border:1px solid #ffffff88;background:transparent;color:#fff;border-radius:8px;padding:4px 9px;font-size:13px}
main{flex:1;overflow:auto;padding:14px 14px 24px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:19px}
nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.low{border-color:var(--red);background:var(--redbg);border-left:6px solid var(--red)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}.b{font-weight:700}.red{color:var(--red)}.ok{color:var(--ok)}
.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.btn.ghost{background:var(--pri2);color:var(--pri)}.btn.warn{background:var(--redbg);color:var(--red)}.btn.sm{padding:6px 10px;font-size:13px}
.btn.amb{background:var(--amb);color:#3a2900}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 0}label input,label select{margin-top:3px;color:var(--ink)}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:10px;padding-bottom:2px}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat small{color:var(--mut);display:block}.stat b{font-size:19px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--pri2);color:var(--pri)}
.tag.r{background:var(--red);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
h2{font-size:17px;margin:4px 0 10px}h3{margin:0 0 6px}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}#modal.open{display:flex}
.sheet{background:#fff;width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16252b;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;display:none;z-index:10;max-width:90%}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.inv{font-size:14px}.inv .line{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.plan{border:2px solid var(--line)}.plan.cur{border-color:var(--pri);background:var(--pri2)}
.bar{display:flex;flex-wrap:wrap;gap:6px;position:sticky;bottom:-16px;background:#fff;padding:10px 0 2px;margin-top:8px;border-top:1px solid var(--line)}
.btn[disabled]{opacity:.5}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">Diary Apps</h1><span id="badge" class="badge"></span><button class="lang" id="langBtn"></button></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="modal"></div><div id="toast"></div>

function uuid(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]&15;return(c==='x'?r:(r&3|8)).toString(16)})}
if(!S.dev){S.dev=uuid();save()}
// Free is the default. A paid plan is active only when the backend (Supabase) has approved it.
function subState(){
  const s=S.sub;if(s.plan==='free'||!s.expiry)return{plan:'free',st:'free',left:0};
  const left=Math.ceil((s.expiry-Date.now())/DAY);
  return{plan:s.plan,st:left>0?'active':'expired',left:Math.max(left,0)};
}
const tier=()=>subState().st==='active'?'pro':'free';
const PENDING=()=>!!(S.req&&S.req.status==='pending');
const planName=p=>p==='monthly'?t('monthlyP')+' Pro':p==='yearly'?t('yearlyP')+' Pro':t('free');
function upsell(){modal(`<h3>🔒 ${t('subscription')}</h3><p>${t('proOnly')}</p><div class="btns"><button class="btn ghost" onclick="closeM()">${t('close')}</button><button class="btn amb" onclick="closeM();openView('sub')">${t('upgrade')}</button></div>`)}

async function rpc(fn,args){
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY)throw new Error('not_configured');
  const h={'Content-Type':'application/json',apikey:CFG.SUPABASE_ANON_KEY};
  if(/^eyJ/.test(CFG.SUPABASE_ANON_KEY))h.Authorization='Bearer '+CFG.SUPABASE_ANON_KEY;
  let r;try{r=await fetch(CFG.SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)})}catch(e){throw new Error('network')}
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&(j.message||j.error))||('http_'+r.status));
  return j;
}
const errMsg=e=>{const m=e.message||'';return m==='not_configured'?t('notSetup'):m==='network'?t('netErr'):/trx_used/.test(m)?t('trxUsed'):/pending_exists/.test(m)?t('pendingExists'):/invalid_sender/.test(m)?t('invalidNumber'):/invalid_trx/.test(m)?t('invalidTrx'):m};
async function pushReq(r){
  try{const o=await rpc('submit_subscription_request',{p_device_id:S.dev,p_plan:r.plan,p_amount:r.amount,p_method:String(r.method).toLowerCase(),p_sender:r.sender,p_trx:r.trx,p_reference:r.reference||''});r.id=o.id;r.synced=true}
  catch(e){if(/pending_exists/.test(e.message))r.synced=true;else throw e}
}
// Reads the approval result from the backend. Only here can a paid plan become Active.
async function syncSub(silent){
  try{
    if(S.req&&S.req.status==='pending'&&!S.req.synced)await pushReq(S.req);
    const r=await rpc('get_subscription_status',{p_device_id:S.dev}); // null if this device has no row yet
    const paid=r&&r.plan&&r.plan!=='free'&&r.expires_at;
    S.sub=paid?{v2:1,plan:r.plan,expiry:Date.parse(r.expires_at)||0}:{v2:1,plan:'free',expiry:0};
    if(r&&(r.status==='pending'||r.status==='rejected'))
      S.req={...(S.req||{}),plan:r.requested_plan||(S.req&&S.req.plan)||'monthly',status:r.status,note:r.admin_note||'',trx:r.trx_id||(S.req&&S.req.trx),synced:true,ts:Date.parse(r.updated_at)||Date.now()};
    else if(r&&S.req&&S.req.synced)S.req=null; // approved: the plan itself now shows it
    save();render();if(!silent)toast(t('statusUpdated'));
  }catch(e){if(!silent)toast(errMsg(e))}
}

function calc(src){
  const g=i=>parseFloat($('#f_'+i).value)||0;const b=g('buy');let s=g('sell');
  if(src==='p')s=b+g('pr');else if(src==='m')s=b+b*g('mg')/100;
  if(src==='p'||src==='m')$('#f_sell').value=+s.toFixed(2);
  if(src!=='p')$('#f_pr').value=+(s-b).toFixed(2);
  if(src!=='m')$('#f_mg').value=b?+((s-b)/b*100).toFixed(1):0;
}
function saveP(id){
  const g=i=>$('#f_'+i).value.trim(),n=g('name');if(!n)return $('#f_name').focus();
  const o={name:n,cat:g('cat'),buy:+g('buy')||0,sell:+g('sell')||0,qty:parseInt(g('qty'))||0,weight:g('w'),size:g('size'),note:g('note')};
  if(id)Object.assign(S.products.find(x=>x.id===id),o);else S.products.push({id:uid(),...o});

function doMv(id,dir){
  const p=S.products.find(x=>x.id===id),n=parseInt($('#m_q').value)||0;if(n<=0)return;
  if(dir==='in'){const c=parseFloat($('#m_c').value);const cost=isNaN(c)?p.buy:c;p.qty+=n;p.buy=cost;
    S.txns.push({id:uid(),ts:Date.now(),type:'expense',kind:'stockin',amt:n*cost,note:`${p.name} ×${n}`});}
  else{if(n>p.qty)return toast(t('noStock'));p.qty-=n;
    S.txns.push({id:uid(),ts:Date.now(),type:'income',kind:'stockout',amt:n*p.sell,cogs:n*p.buy,note:`${p.name} ×${n}`});}
  save();closeM();render();
}

/* ---------- LEDGER ---------- */
S.f=S.f||1;S.grp=S.grp||'d';
const from=d=>{if(d==='all')return 0;if(d===1){const x=new Date();x.setHours(0,0,0,0);return+x}return Date.now()-d*DAY};
function setF(d){const days=d==='all'?9999:d;if(tier()==='free'&&days>LIM.ledgerDays)return upsell();S.f=d;save();render()}
function vLedger(){
  const f=S.f,tx=S.txns.filter(x=>x.ts>=from(f)).sort((a,b)=>b.ts-a.ts);
  const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
  const sales=sum(tx.filter(x=>x.type==='income'),x=>x.amt),exp=sum(tx.filter(x=>x.type==='expense'),x=>x.amt);
  const cogs=sum(tx,x=>x.cogs||0),opex=sum(tx.filter(x=>x.type==='expense'&&x.kind!=='stockin'),x=>x.amt);
  const profit=sales-cogs-opex,bal=sales-exp,cap=sum(S.products,p=>p.buy*p.qty),tgt=sales*S.margin/100;
  const chips=[[1,'today'],[7,'d7'],[30,'d30'],[90,'d90'],['all','all']].map(([d,k])=>`<button class="chip ${f===d?'on':''}" onclick="setF(${typeof d==='string'?`'${d}'`:d})">${t(k)}</button>`).join('');
  const key=x=>{const d=new Date(x.ts),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return S.grp==='y'?`${y}`:S.grp==='m'?`${y}-${m}`:`${y}-${m}-${dd}`};
  const G={};tx.forEach(x=>{const k=key(x),g=G[k]=G[k]||{s:0,e:0,c:0,o:0};if(x.type==='income')g.s+=x.amt;else{g.e+=x.amt;if(x.kind!=='stockin')g.o+=x.amt}g.c+=x.cogs||0});
  const rows=Object.keys(G).sort().reverse().map(k=>{const g=G[k],p=g.s-g.c-g.o;return`<tr><td>${k}</td><td>${money(g.s)}</td><td>${money(g.e)}</td><td class="${p>=0?'ok':'red'}">${money(p)}</td></tr>`}).join('');
  $('#main').innerHTML=`<div class="chips">${chips}</div>
  <div class="grid"><div class="stat"><small>${t('sales')}</small><b class="ok">${money(sales)}</b></div><div class="stat"><small>${t('expenses')}</small><b class="red">${money(exp)}</b></div>
  <div class="stat"><small>${t('netProfit')}</small><b class="${profit>=0?'ok':'red'}">${money(profit)}</b></div><div class="stat"><small>${t('balance')}</small><b>${money(bal)}</b></div>
  <div class="stat"><small>${t('capital')}</small><b>${money(cap)}</b></div><div class="stat"><small>${t('target')} (${S.margin}%)</small><b>${money(tgt)}</b></div></div>
  <div class="btns" style="margin:0 0 10px"><button class="btn sm" onclick="txForm('income')">＋ ${t('addIncome')}</button><button class="btn sm warn" onclick="txForm('expense')">－ ${t('addExpense')}</button></div>
  <div class="card"><div class="chips" style="margin-bottom:6px">${[['d','daily'],['m','monthly'],['y','yearly']].map(([k,l])=>`<button class="chip ${S.grp===k?'on':''}" onclick="S.grp='${k}';save();render()">${t(l)}</button>`).join('')}</div>
  ${rows?`<table><tr><th>${t('period')}</th><th>${t('sales')}</th><th>${t('expenses')}</th><th>${t('profit')}</th></tr>${rows}</table>`:`<div class="empty">${t('noTx')}</div>`}</div>
  <h2>${t('entries')}</h2>${tx.slice(0,40).map(x=>`<div class="card between"><div><div class="b">${esc(x.note||x.kind||'')}</div><div class="mut">${fdate(x.ts)}</div></div><b class="${x.type==='income'?'ok':'red'}">${x.type==='income'?'+':'−'}${money(x.amt)}</b></div>`).join('')}`;
}

/* picture of the invoice (used for PNG / JPG / PDF download) */
function drawInvoice(v){
  const W=800,P=44,n=v.items.length,RH=36,top=290,H=top+266+n*RH;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F=(sz,w,st)=>`${st||''} ${w||'normal'} ${sz}px Georgia,"Noto Serif Bengali","Noto Sans Bengali",serif`;
  const fit=(s,mw)=>{s=String(s);if(x.measureText(s).width<=mw)return s;while(s.length>1&&x.measureText(s+'…').width>mw)s=s.slice(0,-1);return s+'…'};
  const wrap=(s,mw,max)=>{const out=[];let line='';String(s||'').split(/\s+/).filter(Boolean).forEach(w=>{const tst=line?line+' '+w:w;if(x.measureText(tst).width>mw&&line){out.push(line);line=w}else line=tst});if(line)out.push(line);return out.slice(0,max)};
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textBaseline='alphabetic';
  const b=v.biz||{};
  x.textAlign='left';x.fillStyle='#111';x.font=F(30,'bold');x.fillText(fit(b.name||'Diary Apps',430),P,P+30);
  x.font=F(15);x.fillStyle='#444';let y=P+56;wrap(b.addr,430,2).forEach(l=>{x.fillText(l,P,y);y+=20});if(b.phone)x.fillText(b.phone,P,y);
  x.textAlign='right';x.fillStyle='#111';x.font=F(32,'bold');x.fillText(t('invoiceTitle'),W-P,P+30);
  x.font=F(15);x.fillStyle='#444';x.fillText(v.no?'No: #'+v.no:'DRAFT',W-P,P+58);x.fillText(fdate(v.ts||Date.now()),W-P,P+80);
  x.fillStyle='#111';x.fillRect(P,150,W-2*P,3);x.fillRect(P,157,W-2*P,1);
  x.textAlign='left';x.font=F(14,'normal','italic');x.fillStyle='#666';x.fillText(t('billTo'),P,186);
  x.fillStyle='#111';x.font=F(20,'bold');x.fillText(fit(v.cust||t('walkin'),380),P,212);
  x.font=F(15);x.fillStyle='#444';let yy=234;if(v.phone){x.fillText(v.phone,P,yy);yy+=20}wrap(v.addr,380,2).forEach(l=>{x.fillText(l,P,yy);yy+=20});
  x.textAlign='right';x.fillText(`${t('totalWeight')}: ${(+v.weight||0).toFixed(2)} kg`,W-P,212);if(v.sizes)x.fillText(fit(`${t('sizes')}: ${v.sizes}`,300),W-P,234);
  x.fillStyle='#eceff0';x.fillRect(P,top,W-2*P,36);x.fillStyle='#111';x.fillRect(P,top,W-2*P,1);x.fillRect(P,top+35,W-2*P,1);
  x.font=F(15,'bold');x.textAlign='left';x.fillText(t('desc'),P+8,top+24);x.textAlign='right';x.fillText(t('qty'),470,top+24);x.fillText(t('unitPrice'),620,top+24);x.fillText(t('amount'),W-P-8,top+24);
  let ty=top+36;
  v.items.forEach(i=>{x.font=F(16);x.fillStyle='#111';x.textAlign='left';x.fillText(fit(i.name,340),P+8,ty+24);x.textAlign='right';x.fillText(String(i.qty),470,ty+24);x.fillText(money(i.price),620,ty+24);x.fillText(money(i.price*i.qty),W-P-8,ty+24);x.fillStyle='#d6dcdc';x.fillRect(P,ty+RH-1,W-2*P,1);ty+=RH});
  ty+=20;const lx=430,rx=W-P;x.fillStyle='#111';x.font=F(16);
  x.textAlign='left';x.fillText(t('subtotal'),lx,ty+16);x.textAlign='right';x.fillText(money(v.sub),rx,ty+16);
  x.textAlign='left';x.fillText(t('delivery'),lx,ty+44);x.textAlign='right';x.fillText(money(v.delivery),rx,ty+44);
  x.fillRect(lx,ty+60,rx-lx,2);x.fillRect(lx,ty+100,rx-lx,2);x.font=F(20,'bold');x.textAlign='left';x.fillText(t('total'),lx,ty+88);x.textAlign='right';x.fillText(money(v.total),rx,ty+88);
  const fy=ty+170;x.fillRect(P,fy,200,1);x.textAlign='left';x.font=F(13);x.fillStyle='#444';x.fillText(t('sign'),P,fy+20);x.textAlign='right';x.font=F(14,'normal','italic');x.fillText(t('thanks'),W-P,fy+20);
  return c;
}
function previewDraft(){if(!D.items.length)return toast(t('noItems'));showInvObj({ts:Date.now(),...snapshot()})}
function saveInv(){
  if(!D.items.length)return toast(t('noItems'));
  if(tier()==='free'&&S.invoices.length>=LIM.invoices)return upsell();
  for(const i of D.items){const p=S.products.find(x=>x.id===i.pid);if(!p||p.qty<i.qty)return toast(`${t('noStock')}: ${p?p.name:''}`)}
  const v={id:uid(),no:S.invoices.length+1001,ts:Date.now(),...snapshot()};
  v.custId=upsertCust(v);
  let cogs=0;D.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);p.qty-=i.qty;cogs+=p.buy*i.qty});
  S.invoices.push(v); // delivery charge is not counted as shop income (it is passed to the courier)
  S.txns.push({id:uid(),ts:v.ts,type:'income',kind:'invoice',amt:v.sub,cogs,note:`${t('invoiceNo')} #${v.no}`});
  D={cust:'',phone:'',addr:'',items:[],delivery:0};save();render();showInv(v.id);
}
function upsertCust(v){ // customers are created automatically from invoices
  const nm=v.cust,ph=v.phone;if(!nm&&!ph)return 0;
  let c=S.customers.find(x=>(ph&&x.phone===ph)||(!ph&&x.name.toLowerCase()===nm.toLowerCase()));
  if(!c){c={id:uid(),name:nm||ph,phone:ph,address:v.addr};S.customers.push(c)}
  else{if(!c.phone&&ph)c.phone=ph;if(!c.address&&v.addr)c.address=v.addr}
  return c.id;
}
function showInv(id){showInvObj(S.invoices.find(x=>x.id===id))}

  curInv=v;
  modal(`<div style="overflow-x:auto">${paperHTML(v)}</div>${v.courier?`<div class="card" style="margin-top:10px">🚚 <b>${esc(v.courier.name)}</b>${v.courier.tracking?' · '+esc(v.courier.tracking):''}</div>`:''}

function printInv(){
  const v=curInv;if(!v)return;
  if(window.Android&&Android.print)Android.print(printDoc(v),'Invoice-'+(v.no||'draft'));else window.print();
}
function dlInv(kind){
  const v=curInv;if(!v)return;const name='Invoice-'+(v.no||'draft')+'-'+new Date().toISOString().slice(0,10);
  const png=drawInvoice(v).toDataURL('image/png');
  if(window.Android&&Android.saveFile){const r=String(Android.saveFile(png.split(',')[1],name,kind));toast(r.indexOf('ok:')===0?t('savedTo')+' '+r.slice(3):t('failed')+' '+r.slice(4))}
  else if(kind==='pdf')window.print();
  else{const a=document.createElement('a');a.href=png;a.download=name+'.png';document.body.appendChild(a);a.click();a.remove()}
}
function shareInv(){const x=invText(curInv);
  if(window.Android&&Android.share)Android.share(x);else if(navigator.share)navigator.share({text:x});else toast(x)}

function vSub(){
  const s=subState(),r=S.req,pend=PENDING(),dst=s.st==='free'?'free':s.st;
  const card=(k,price,per)=>{
    const isCur=(k==='free'&&s.st!=='active')||(k===s.plan&&s.st==='active');let act='';
    if(isCur)act=`<span class="tag">${t('current')}</span>`;
    else if(k!=='free'){
      if(pend)act=r.plan===k?`<span class="tag" style="background:var(--amb);color:#3a2900">⏳ ${t('pending')}</span>`:`<button class="btn sm ghost" disabled style="opacity:.5">${t('choose')}</button>`;
      else act=`<button class="btn sm amb" onclick="payForm('${k}')">${k===s.plan?t('renew'):t('choose')}</button>`;
    }
    return`<div class="card plan ${isCur?'cur':''}"><div class="between"><div><div class="b">${planName(k)}</div><div>${price?money(price)+' '+per:t('free')}</div></div>${act}</div></div>`;
  };
  const feat=p=>p==='pro'?[t('unlimited'),t('unlimited'),t('all'),'✓']:[LIM.products,LIM.invoices,t('d30'),'—'];
  $('#main').innerHTML=`<div class="between"><h2>⭐ ${t('subscription')}</h2><button class="btn sm ghost" onclick="view=null;render()">‹</button></div>
  <div class="card"><div class="mut">${t('status')}</div><div class="b" style="font-size:18px">${planName(s.st==='free'?'free':s.plan)} · <span class="${s.st==='expired'?'red':'ok'}">${t(dst)}</span></div>
  ${s.st!=='free'?`<div class="mut">${t('expires')}: ${fdate(S.sub.expiry)}${s.st==='active'?` (${s.left} ${t('daysLeft')})`:''}</div>`:''}</div>
  ${pend?`<div class="card" style="background:#fff6dd;border-color:var(--amb)"><div class="b">⏳ ${t('pendingTitle')}: ${planName(r.plan)}</div><div class="mut">${t('pendingBody')}<br>TrxID: ${esc(r.trx||'')}${r.synced===false?`<br><span class="red">${t('notSent')}</span>`:''}</div><div class="btns"><button class="btn sm" onclick="syncSub()">↻ ${t('checkStatus')}</button></div></div>`:''}
  ${r&&r.status==='rejected'?`<div class="card low"><div class="b red">${t('rejected')}</div><div class="mut">${t('rejectedBody')}${r.note?'<br>'+esc(r.note):''}</div></div>`:''}
  ${card('free',0)}${card('monthly',PLANS.monthly.price,t('perMonth'))}${card('yearly',PLANS.yearly.price,t('perYear'))}
  <div class="card"><div class="b">${t('feat')}</div><table><tr><th></th><th>${t('free')}</th><th>${t('proPlan')}</th></tr>${[t('f1'),t('f2'),t('f3'),t('f4')].map((n,i)=>`<tr><td>${n}</td><td>${feat('free')[i]}</td><td>${feat('pro')[i]}</td></tr>`).join('')}</table></div>
  <div class="btns" style="margin-bottom:8px"><button class="btn ghost" onclick="syncSub()">↻ ${t('checkStatus')}</button></div>
  <p class="mut">${t('accountId')}: ${S.dev.slice(0,8)}${CFG.SUPPORT_PHONE?` · ${t('support')}: <a href="tel:${esc(CFG.SUPPORT_PHONE)}" style="color:var(--pri)">${esc(CFG.SUPPORT_PHONE)}</a>`:''}</p>`;
}
function payForm(plan){
  if(PENDING())return toast(t('pendingExists'));
  const price=PLANS[plan].price,methods=CFG.PAYMENT_METHODS||['bKash'],nums=CFG.PAYMENT_NUMBERS||{};
  modal(`<h3>${planName(plan)} — ${money(price)}</h3>
  <div class="card" style="background:var(--pri2)"><div class="mut">${t('payTo')} (${esc(CFG.PAYMENT_ACCOUNT_TYPE||'Personal')})</div><div class="between"><b id="p_num" style="font-size:21px">${esc(nums[methods[0]]||'')}</b><button class="btn sm" onclick="copyNum()">${t('copy')}</button></div><div class="mut">${t('sendExact')} <b>${money(price)}</b></div></div>
  <label>${t('method')}<select id="p_m" onchange="payMethod()">${methods.map(m=>`<option>${esc(m)}</option>`).join('')}</select></label>
  <label>${t('yourNumber')}<input id="p_s" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX"></label>
  <label>${t('trxId')}<input id="p_t" autocapitalize="characters" autocomplete="off" placeholder="ABC123XYZ"></label>
  <label>${t('amountSent')} ৳<input id="p_a" type="number" inputmode="decimal" value="${price}"></label>
  <label>${t('reference')}<input id="p_r" value="${esc(S.biz.name)}"></label>
  <p class="mut">${t('payNote')}</p>
  <div class="btns"><button class="btn ghost" onclick="closeM()">${t('cancel')}</button><button class="btn amb" id="p_btn" onclick="submitPay('${plan}')">${t('submitPay')}</button></div>`);
}
function payMethod(){$('#p_num').textContent=(CFG.PAYMENT_NUMBERS||{})[$('#p_m').value]||''}
function copyNum(){const n=$('#p_num').textContent;const ta=document.createElement('textarea');ta.value=n;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();toast(t('copied'))}
async function submitPay(plan){
  const g=i=>$('#p_'+i).value.trim();
  const sender=g('s').replace(/[\s-]/g,'').replace(/^\+?88/,'');if(!/^01[3-9]\d{8}$/.test(sender))return toast(t('invalidNumber'));
  const trx=g('t').toUpperCase();if(!/^[A-Z0-9]{6,30}$/.test(trx))return toast(t('invalidTrx'));
  const amount=parseFloat(g('a'));if(!(amount>0))return toast(t('invalidAmt'));
  const r={plan,amount,method:g('m'),sender,trx,reference:g('r'),status:'pending',synced:false,ts:Date.now()};
  const b=$('#p_btn');b.disabled=true;
  try{await pushReq(r);S.req=r;save();closeM();render();toast(t('pendingMsg'));syncSub(true)}
  catch(e){
    b.disabled=false;
    if(e.message==='network'){S.req=r;save();closeM();render();toast(t('netSaved'))} // kept as Pending, sent when online
    else toast(errMsg(e));
  }
}

render();
syncSub(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSub(true)});
</script>
</body>
</html>
